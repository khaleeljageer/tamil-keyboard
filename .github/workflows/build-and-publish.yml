name: Build and Publish Debian Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed so GITHUB_TOKEN may push the rebuilt archive to gh-pages.
    permissions:
      contents: write

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts build-essential debhelper apt-utils
    
    - name: Build tamil-keyboard
      run: |
        cd tamil-keyboard
        dpkg-buildpackage -b -us -uc
        cd ..

    - name: Create repository structure
      run: |
        mkdir -p docs/pool/main/t/tamil-keyboard
        mkdir -p docs/dists/stable/main/binary-amd64
        # GitHub Pages runs Jekyll over the branch by default, which is not
        # something an apt archive should be filtered through.
        touch docs/.nojekyll

    - name: Copy packages
      run: |
        cp tamil-keyboard_*.deb docs/pool/main/t/tamil-keyboard/

    - name: Generate Packages file
      run: |
        cd docs
        # apt resolves compression variants from the uncompressed entry, so ship
        # both Packages and Packages.gz and list both in Release.
        dpkg-scanpackages --arch amd64 pool/ /dev/null > dists/stable/main/binary-amd64/Packages
        gzip -9kf dists/stable/main/binary-amd64/Packages

    - name: Generate Release file
      run: |
        cd docs/dists/stable
        # apt-ftparchive emits the MD5Sum/SHA256 blocks covering every index file.
        # Without them the GPG signature guarantees nothing about the package list
        # and apt rejects the repo as "weak security information".
        apt-ftparchive \
          -o APT::FTPArchive::Release::Origin="Kaniyam Foundation" \
          -o APT::FTPArchive::Release::Label="Tamil Keyboard Repository" \
          -o APT::FTPArchive::Release::Suite="stable" \
          -o APT::FTPArchive::Release::Codename="stable" \
          -o APT::FTPArchive::Release::Architectures="amd64" \
          -o APT::FTPArchive::Release::Components="main" \
          -o APT::FTPArchive::Release::Description="Tamil keyboard layout packages for Debian/Ubuntu" \
          release . > Release.tmp
        mv Release.tmp Release
        cat Release

    - name: Setup GPG
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "::error::GPG_PRIVATE_KEY is not set. An unsigned archive is" \
               "rejected by apt, so publishing one would be worse than failing."
          exit 1
        fi

        echo "$GPG_PRIVATE_KEY" | gpg --batch --import

        # Publish the public half of the very key we are about to sign with.
        # Deriving it here means the key users download cannot drift from the
        # key the signature was made with. Armored, hence .asc: apt reads that
        # directly via signed-by, so users need no dearmor step.
        gpg --armor --export > docs/public-key.asc
        echo "Publishing signing key:"
        gpg --show-keys --with-fingerprint docs/public-key.asc

        cd docs/dists/stable
        if [ -n "$GPG_PASSPHRASE" ]; then
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 -abs -o Release.gpg Release
        else
          gpg --batch -abs -o Release.gpg Release
        fi
    
    - name: Create InRelease file
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        cd docs/dists/stable
        if [ -n "$GPG_PASSPHRASE" ]; then
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 -abs --clearsign -o InRelease Release
        else
          gpg --batch -abs --clearsign -o InRelease Release
        fi
    
    - name: Get version/tag
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
        else
          VERSION="latest-$(date +%Y%m%d-%H%M%S)"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    # Checking the branch out this way leaves working push credentials behind,
    # which a bare "git init" in a subdirectory does not inherit.
    - name: Check out gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages

    - name: Update repository
      run: |
        # "docs/." rather than "docs/*" so dotfiles such as .nojekyll come too.
        cp -r docs/. gh-pages/
        # Legacy name from before the key was published as public-key.asc.
        # Copying never deletes, so it would otherwise be served forever.
        rm -f gh-pages/KEY.gpg
        cd gh-pages
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        # --force because the branch carries the source .gitignore, which
        # ignores dists/, pool/, *.asc and *.gpg -- i.e. every file the archive
        # is made of. Without this the commit silently contains nothing.
        git add --force .
        git status --short
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update repository for ${{ steps.version.outputs.version }}"
          git push origin gh-pages
        fi
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          tamil-keyboard_*.deb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

